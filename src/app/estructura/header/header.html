<header class="racing-header">
  <div class="brand-core">
    <div class="logo-bolt">
      <span class="bolt-neon">⚡</span>
    </div>
    <div class="brand-titles">
      <h1 class="title-speed">MOTODYNAMIQ</h1>
      <span class="subtitle-rpm">Gestor de Inventarios</span>
    </div>
  </div>

  <div class="search-nitro-wrapper">
    <span class="nitro-icon">🔥</span>
    <input type="text" placeholder="Escanear sistema o buscar módulo..." class="input-nitro" />
  </div>

  <div class="telemetry-panel">
    <div class="status-gauge">
      <div class="gauge-bar filled"></div>
    </div>

    <button class="alert-trigger" data-count="3">
      <span class="alert-icon">🔔</span>
    </button>

    <div class="pilot-card">
      <div class="pilot-avatar">
        <span class="pilot-initials">AC</span>
        <div class="avatar-pulse"></div>
      </div>
      <div class="pilot-info">
        <span class="pilot-name">Andrés Acevedo</span>
        <span class="pilot-rank">ADMIN // VENDEDOR</span>
      </div>
    </div>
  </div>
</header>
